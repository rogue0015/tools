<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brandon's Small Apps</title>
<style>
  :root {
    --bg:#f6f7f9; --panel:#ffffff; --ink:#14161a; --muted:#646b76;
    --line:#e3e6ea; --line-strong:#cdd2d9; --accent:#2f6df6;
    --radius:12px; --shadow:0 1px 2px rgba(16,20,28,.06), 0 8px 24px rgba(16,20,28,.06);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1115; --panel:#171a20; --ink:#e9ecf1; --muted:#99a2b0;
      --line:#262b33; --line-strong:#39404a; --accent:#4d82ff;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width:880px; margin:0 auto; padding:48px 16px; }
  h1 { margin:0 0 4px; font-size:28px; letter-spacing:-.01em; }
  .sub { margin:0 0 32px; color:var(--muted); }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); }
  a.card {
    display:block; padding:20px; text-decoration:none; color:inherit;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); transition:border-color .15s, transform .15s;
  }
  a.card:hover, a.card:focus-visible { border-color:var(--accent); transform:translateY(-2px); outline:none; }
  .icon { font-size:28px; line-height:1; margin-bottom:12px; }
  .name { font-weight:600; font-size:18px; margin:0 0 4px; }
  .desc { margin:0; color:var(--muted); font-size:14px; }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Brandon's Small Apps</h1>
  <p class="sub">A collection of little tools. Pick one.</p>
  <div class="grid" id="grid"></div>
</main>

<script>
  // To add an app: drop its folder next to this file and add a line here.
  const APPS = [
    { name: "QR Code Generator", href: "qr/index.html", icon: "▦",
      desc: "Make colourful, logo-ready QR codes and download them as PNG or SVG." },
    { name: "Cover Page Maker", href: "cover/index.html", icon: "▤",
      desc: "Build A4 assignment cover pages (single or group), preview, and download as PDF or Word. Nothing is stored." },
  ];

  const grid = document.getElementById("grid");
  if (!APPS.length) grid.innerHTML = '<p class="empty">No apps yet.</p>';
  for (const app of APPS) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = app.href;
    const icon = document.createElement("div"); icon.className = "icon"; icon.textContent = app.icon;
    const name = document.createElement("h2"); name.className = "name"; name.textContent = app.name;
    const desc = document.createElement("p"); desc.className = "desc"; desc.textContent = app.desc;
    a.append(icon, name, desc);
    grid.append(a);
  }
</script>
</body>
</html>
