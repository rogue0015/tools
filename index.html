<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08060B">
<title>Brandon's Small Apps</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* phones: content starts at the top, single column of full-width cards */
  main{ width:100%; max-width:920px; margin:0 auto; padding:16px var(--gutter) calc(40px + env(safe-area-inset-bottom)); }
  .sub{ margin-bottom:28px; }
  .grid{ display:grid; gap:14px; grid-template-columns:1fr; }
  a.card{
    display:block; padding:20px 18px 22px; text-decoration:none; color:inherit;
    transition:border-color .2s, transform .2s;
  }
  a.card:active, a.card:focus-visible{ border-color:var(--acid); outline:none; }
  a.card:active .name, a.card:focus-visible .name{ color:var(--acid); }
  @media (hover:hover){
    a.card:hover{ border-color:var(--acid); transform:translateY(-2px); }
    a.card:hover .name{ color:var(--acid); }
  }
  /* larger screens: centred vertically, multi-column grid */
  @media (min-width:640px){
    body{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; justify-content:center; }
    main{ padding:40px 24px 56px; }
    .sub{ margin-bottom:36px; }
    .grid{ gap:18px; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); }
    a.card{ padding:22px 22px 24px; }
  }
  .idx{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--sunburst); margin-bottom:18px; }
  .icon{ font-size:22px; line-height:1; color:var(--sigblue); }
  .card .name{ font-family:var(--display); font-weight:400; text-transform:uppercase; letter-spacing:.01em; font-size:1.55rem; line-height:1.05; margin:0 0 10px; color:var(--paper); transition:color .2s; }
  .desc{ margin:0; color:var(--paper-dim); font-size:14px; line-height:1.6; }
  .go{ margin-top:18px; font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; color:var(--acid); }
  .empty{ color:var(--paper-dim); }
  footer{ margin-top:32px; }
</style>
</head>
<body>
<div class="grain"></div>
<main>
  <div class="topbar">
    <span class="brandmark"><span class="dotlive"></span> <span class="full">BRANDON.T.BANDE //&nbsp;</span>ROGUE0015</span>
    <a class="back" href="https://rogue0015.github.io/">PORTFOLIO →</a>
  </div>
  <div class="tag">00 / TOOLKIT</div>
  <h1>Brandon's <span class="accent">Small</span> Apps</h1>
  <p class="sub">A collection of little tools. Pick one.</p>
  <div class="grid" id="grid"></div>
  <footer>Runs in your browser · nothing is uploaded</footer>
</main>

<script>
  // To add an app: drop its folder next to this file and add a line here.
  const APPS = [
    { name: "QR Code Generator", href: "qr/index.html", icon: "▦",
      desc: "Make colourful, logo-ready QR codes and download them as PNG or SVG." },
    { name: "Cover Page Maker", href: "cover/index.html", icon: "▤",
      desc: "Build A4 assignment cover pages (single or group), preview, and download as PDF or Word. Nothing is stored." },
  ];

  const grid = document.getElementById("grid");
  if (!APPS.length) grid.innerHTML = '<p class="empty">No apps yet.</p>';
  APPS.forEach((app, i) => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = app.href;
    const idx = document.createElement("div"); idx.className = "idx";
    const num = document.createElement("span"); num.textContent = "APP " + String(i + 1).padStart(2, "0");
    const icon = document.createElement("span"); icon.className = "icon"; icon.textContent = app.icon;
    idx.append(num, icon);
    const name = document.createElement("h2"); name.className = "name"; name.textContent = app.name;
    const desc = document.createElement("p"); desc.className = "desc"; desc.textContent = app.desc;
    const go = document.createElement("div"); go.className = "go"; go.textContent = "→ OPEN";
    a.append(idx, name, desc, go);
    grid.append(a);
  });
</script>
</body>
</html>
